name: Build & Release VirtualXposed

on:
  push:
    branches: [ vxp, main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate project and launcher submodule
        run: |
          # Works whether VirtualApp/ is at the repo root or nested
          # (e.g. VirtualXposed-vxp/VirtualApp).
          # If the project was committed as a .zip instead of extracted
          # files, unpack it first.
          if [ -z "$(find . -type d -name VirtualApp -not -path '*/.git/*' | head -n1)" ]; then
            for z in ./*.zip; do
              [ -f "$z" ] || continue
              echo "Extracting $z"
              unzip -q -o "$z" -d "$GITHUB_WORKSPACE/_extracted"
            done
          fi
          APP_DIR=$(find . -type d -name VirtualApp -not -path '*/.git/*' -not -path '*/node_modules/*' | head -n1)
          test -n "$APP_DIR" || { echo "VirtualApp directory not found"; find . -maxdepth 2 -not -path './.git*'; exit 1; }
          APP_DIR=$(cd "$APP_DIR" && pwd)
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Project at $APP_DIR"
          # Nested checkouts don't get their submodule fetched; do it by hand.
          if [ -z "$(ls -A "$APP_DIR/launcher" 2>/dev/null)" ]; then
            GM="$(dirname "$APP_DIR")/.gitmodules"
            URL=$(git config -f "$GM" --get submodule.VirtualApp/launcher.url || true)
            URL=${URL:-https://github.com/ozipoetra/Launcher3.git}
            echo "Cloning launcher from $URL"
            rm -rf "$APP_DIR/launcher"
            git clone --depth 1 "$URL" "$APP_DIR/launcher"
          fi
          ls "$APP_DIR/launcher" | head

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK platform + NDK
        shell: bash
        run: |
          # sdkmanager prompts "Accept? (y/N)" for every license it hasn't
          # seen, on install as well as on --licenses. Feed it "y" on stdin
          # for every call, and don't let SIGPIPE from `yes` fail the step.
          set +o pipefail
          NDK=27.2.12479018

          # The ubuntu-latest runner ships with the Android SDK and
          # cmdline-tools preinstalled (android-actions/setup-android is
          # no longer needed and fails on the removed 'tools' package).
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "Using $SDKM"

          yes | "$SDKM" --licenses >/dev/null 2>&1 || true

          install() { yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --install "$@"; }

          install "platform-tools" "ndk;$NDK"

          if ! install "platforms;android-37" "build-tools;37.0.0"; then
            echo "API 37 packages unavailable, falling back to 36"
            install "platforms;android-36" "build-tools;36.0.0"
          fi

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK" >> "$GITHUB_ENV"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Uses your own key if you add these repo secrets:
      #   ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Otherwise a throwaway key is generated so the APK is still installable
      # (but updates over a previous build will need an uninstall first).
      - name: Prepare signing key
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$KS"
            ALIAS="$ANDROID_KEY_ALIAS"; PASS="$ANDROID_KEY_PASSWORD"
          else
            ALIAS=vxp; PASS=vxpbuild123
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=VirtualXposed, O=VXP, C=US"
          fi
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "keystore.path=$KS"
            echo "keystore.alias=$ALIAS"
            echo "keystore.pwd=$PASS"
            echo "keystore.alias_pwd=$PASS"
          } > "$APP_DIR/local.properties"

      - name: Patch launcher/build.gradle for Gradle 9 / AGP 9
        run: |
          python3 - <<'PY'
          import os, re

          p = os.path.join(os.environ["APP_DIR"], "launcher", "build.gradle")
          s = open(p).read()
          orig = s

          def block_span(text, name):
              m = re.search(r'(?m)^[ \t]*' + name + r'[ \t]*\{', text)
              if not m:
                  return None
              i = text.index('{', m.start())
              depth = 0
              for j in range(i, len(text)):
                  if text[j] == '{':
                      depth += 1
                  elif text[j] == '}':
                      depth -= 1
                      if depth == 0:
                          return m.start(), i, j + 1
              return None

          # 1. Drop the legacy buildscript block (old AGP 3.0.1 + jcenter()).
          sp = block_span(s, 'buildscript')
          if sp:
              s = s[:sp[0]] + s[sp[2]:]

          # 2. Plugins: application -> library, versions come from settings.gradle.
          s = re.sub(r"(?m)^[ \t]*apply plugin:.*\n", "", s)
          s = "plugins {\n    id 'com.android.library'\n    id 'com.google.protobuf'\n}\n\n" + s

          # 3. Remove things that are invalid in a library / removed in AGP 9.
          for pat in [r"jcenter\(\)", r"buildToolsVersion", r"testApplicationId",
                      r"applicationId", r"targetSdkVersion", r"versionCode",
                      r"versionName", r"flavorDimensions"]:
              s = re.sub(r"(?m)^[ \t]*" + pat + r".*\n", "", s)

          s = re.sub(r"compileSdkVersion\s+\S+", "compileSdk = 37", s)
          s = re.sub(r"minSdkVersion\s+(\d+)", r"minSdk = \1", s)

          # 4. Flavors: same dimension name as :app ('main') so they match by name.
          s = re.sub(r"(?m)^([ \t]*android[ \t]*\{[ \t]*\n)",
                     r"\1    flavorDimensions += ['main']\n", s, count=1)
          # 4b. AGP 9 requires namespace in the build file; the old launcher
          # kept it as package="..." in its manifest.
          if 'namespace' not in s:
              ns = None
              for mf in ["AndroidManifest-common.xml", "AndroidManifest.xml"]:
                  mp = os.path.join(os.path.dirname(p), mf)
                  if os.path.exists(mp):
                      mm = re.search(r'package\s*=\s*"([^"]+)"', open(mp).read())
                      if mm:
                          ns = mm.group(1)
                          break
              ns = ns or "com.android.launcher3"
              print("namespace:", ns)
              s = s.replace("    flavorDimensions += ['main']\n",
                            "    namespace = '" + ns + "'\n    flavorDimensions += ['main']\n", 1)

          # Inline applicationId/testApplicationId are invalid in a library.
          s = re.sub(r"\b(?:test)?[aA]pplicationId\s*=?\s*['\"][^'\"]*['\"]", "", s)

          sp = block_span(s, 'productFlavors')
          if sp:
              start, brace, end = sp
              inner = s[brace + 1:end - 1]
              out, depth, i = [], 0, 0
              while i < len(inner):
                  ch = inner[i]
                  out.append(ch)
                  if ch == '{':
                      if depth == 0:
                          out.append(" dimension = 'main'\n")
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                  i += 1
              s = s[:brace + 1] + "".join(out) + s[end - 1:]

          # 4c. Don't rasterize vector drawables to PNG (crashes on a 0x0 vector;
          # unnecessary since minSdk >= 26).
          s = re.sub(r"(?m)^[ \t]*.*generatedDensities.*\n", "", s)
          if re.search(r"(?m)^[ \t]*defaultConfig[ \t]*\{", s):
              s = re.sub(r"(?m)^([ \t]*defaultConfig[ \t]*\{)",
                         r"\1\n        vectorDrawables.generatedDensities = []\n", s, count=1)
          else:
              s = s.replace("    flavorDimensions += ['main']\n",
                            "    flavorDimensions += ['main']\n    defaultConfig {\n        vectorDrawables.generatedDensities = []\n    }\n", 1)

          # 4d. Other DSL blocks/names removed in AGP 9.
          for name in ["dexOptions", "jackOptions"]:
              while True:
                  sp = block_span(s, name)
                  if not sp:
                      break
                  s = s[:sp[0]] + s[sp[2]:]
          s = re.sub(r"\blintOptions\b", "lint", s)
          s = re.sub(r"\bpackagingOptions\b", "packaging", s)
          s = re.sub(r"\baaptOptions\b", "androidResources", s)
          # Match :app's minSdk so nothing is rasterized / down-leveled.
          s = re.sub(r"minSdk = \d+", "minSdk = 31", s)

          # 5. Removed dependency configurations.
          for old, new in [("androidTestCompile", "androidTestImplementation"),
                           ("testCompile", "testImplementation"),
                           ("provided", "compileOnly"),
                           ("compile", "api")]:
              s = re.sub(r"(?m)^([ \t]*)" + old + r"(?=[ \t(])", r"\1" + new, s)

          # 4e. AGP 8+ stopped generating AIDL stubs and BuildConfig by default.
          # The launcher needs both: the launcherclient/aidlbridge interfaces are
          # .aidl files, and several classes read BuildConfig.APPLICATION_ID.
          if 'buildFeatures' not in s:
              s = s.replace("    flavorDimensions += ['main']\n",
                            "    flavorDimensions += ['main']\n"
                            "    buildFeatures {\n"
                            "        aidl = true\n"
                            "        buildConfig = true\n"
                            "    }\n", 1)

          # A library's BuildConfig has no APPLICATION_ID; the sources read it
          # (provider authorities, component checks), so supply the host app's.
          if 'APPLICATION_ID' not in s:
              s = re.sub(r"(?m)^([ \t]*defaultConfig[ \t]*\{)",
                         "\\1\n        buildConfigField 'String', 'APPLICATION_ID', '\"io.va.exposed64\"'",
                         s, count=1)

          # 4f. Android 12+ requires android:exported on every component that has
          # an intent filter; these 2018-era manifests predate that rule.
          comp = (r'<(activity|activity-alias|service|receiver)\b([^>]*?)>'
                  r'(\s*(?:<!--.*?-->\s*)*)(?=<intent-filter)')

          def add_exported(m):
              if 'android:exported' in m.group(2):
                  return m.group(0)
              return '<%s%s android:exported="true">%s' % (m.group(1), m.group(2), m.group(3))

          for mf in ["AndroidManifest-common.xml", "AndroidManifest.xml"]:
              mp = os.path.join(os.path.dirname(p), mf)
              if not os.path.exists(mp):
                  continue
              x = open(mp).read()
              y = re.sub(comp, add_exported, x, flags=re.S)
              if y != x:
                  open(mp, "w").write(y)
                  print("added android:exported in", mf)

          # 4g. The legacy Canvas save-flag constants were removed from the
          # modern SDK; the one-arg save()/paint-less saveLayer() are equivalent.
          for root_dir, _dirs, files in os.walk(os.path.join(os.path.dirname(p), "src")):
              for fname in files:
                  if not fname.endswith(".java"):
                      continue
                  fp = os.path.join(root_dir, fname)
                  t = open(fp).read()
                  n = re.sub(r"\.save\(\s*Canvas\.(?:MATRIX|CLIP)_SAVE_FLAG\s*\)", ".save()", t)
                  n = re.sub(r",\s*Canvas\.(?:CLIP_TO_LAYER_SAVE_FLAG|HAS_ALPHA_LAYER_SAVE_FLAG)"
                             r"(?:\s*\|\s*Canvas\.(?:CLIP_TO_LAYER_SAVE_FLAG|HAS_ALPHA_LAYER_SAVE_FLAG))*",
                             "", n)
                  if n != t:
                      open(fp, "w").write(n)
                      print("fixed Canvas save flags in", fname)

          # 4h. aapt2 rejects a bare apostrophe in a string that isn't wrapped
          # in double quotes; escape them (quoting protects most translations).
          for root_dir, _dirs, files in os.walk(os.path.join(os.path.dirname(p), "res")):
              if not os.path.basename(root_dir).startswith("values"):
                  continue
              for fname in files:
                  if not fname.endswith(".xml"):
                      continue
                  fp = os.path.join(root_dir, fname)
                  t = open(fp).read()

                  def fix_apos(mm):
                      inner = mm.group(2)
                      if inner.startswith('"') and inner.endswith('"'):
                          return mm.group(0)
                      return mm.group(1) + re.sub(r"(?<!\\)'", r"\\'", inner) + mm.group(3)

                  n = re.sub(r"(<string\b[^>]*>)(.*?)(</string>)", fix_apos, t, flags=re.S)
                  if n != t:
                      open(fp, "w").write(n)
                      print("escaped apostrophes in", fp)

          lib = os.path.join(os.environ["APP_DIR"], "lib", "build.gradle")
          if os.path.exists(lib):
              t = open(lib).read()
              if "ndkVersion" not in t:
                  t = re.sub(r"(compileSdk\s*=\s*\d+\n)",
                             r"\1    ndkVersion = '27.2.12479018'\n", t, count=1)
                  open(lib, "w").write(t)
                  print("pinned ndkVersion in lib/build.gradle")

          open(p + ".orig", "w").write(orig)
          open(p, "w").write(s)
          print("=== patched launcher/build.gradle ===")
          print(s)
          PY

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show the real Gradle error
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          test -f "$LOG" || exit 0
          {
            echo '## Gradle error'
            echo '```'
            grep -n -A25 -m1 'What went wrong' "$LOG" || tail -n 60 "$LOG"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- launcher/build.gradle (first 40 lines) ---"
          head -n 40 "$APP_DIR/launcher/build.gradle" || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/build.log

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          APK=$(find "$APP_DIR/app/build/outputs/apk" -name '*.apk' | head -n1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          VER=$(grep -oP 'versionName = "\K[^"]+' "$APP_DIR/app/build.gradle")
          OUT="dist/VirtualXposed-${VER}-build${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualXposed-release
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: VirtualXposed ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build from commit ${{ github.sha }}.
          files: dist/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
