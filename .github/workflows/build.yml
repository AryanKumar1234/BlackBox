name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs and AARs
        run: ./gradlew assembleDebug assembleRelease :Bcore:assembleDebug :Bcore:assembleRelease --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p dist
          cp ./app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          cp ./app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          for AAR in $(find ./Bcore/build/outputs/aar -name "*.aar"); do
            cp "$AAR" "dist/BlackBox-Bcore-$(basename "$AAR")"
          done
          echo "Collected files:"
          ls -la dist
          if ! ls dist/*.apk >/dev/null 2>&1; then
            echo "No APKs were produced" >&2
            exit 1
          fi

          VERSION_NAME=$(grep -E 'versionName\s*=' build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE=false
          else
            TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
            PRERELEASE=true
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlackBox-${{ steps.collect.outputs.version }}-build-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: BlackBox ${{ steps.collect.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.collect.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Automated build from https://github.com/aryankumar1234

            **Install:** download the universal `*.apk` below (debug or release) and install it on your device.
            The `BlackBox-Bcore-*.aar` files are the core library builds.
            
