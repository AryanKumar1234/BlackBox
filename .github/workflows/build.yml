name: Build & Release (Android 8-16)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BlackBox Reborn is a maintained fork of NewBlackBox with documented
      # Android 14/15/16 compatibility fixes (package parser, ART ArtMethod
      # offsets, GMS signature passthrough, UID spoofing).
      - name: Fetch engine source
        run: |
          git clone --depth 1 https://github.com/fdavids77/BlackBoxReborn.git src
          cd src
          echo "HEAD: $(git rev-parse HEAD)"
          grep -n 'compileSdkVersion\|targetSdkVersion\|minSdk\|versionCode\|versionName' build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform, build-tools and NDK
        shell: bash
        run: |
          set +o pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          install() { yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --install "$@" || true; }
          install "platform-tools" "platforms;android-36"
          install "ndk;27.0.12077973"
          install "build-tools;36.1.0"
          # If that exact build-tools build is unavailable, let AGP pick its default
          # by dropping the explicit buildToolsVersion pins.
          if [ ! -x "$ANDROID_SDK_ROOT/build-tools/36.1.0/aapt2" ]; then
            echo "build-tools 36.1.0 missing - removing buildToolsVersion pins"
            sed -i '/buildToolsVersion/d' src/app/build.gradle src/Bcore/build.gradle
          fi
          ls "$ANDROID_SDK_ROOT/build-tools" || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: src
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show the real Gradle error
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          test -f "$LOG" || exit 0
          {
            echo '## Gradle error'
            echo '```'
            grep -n -A30 -m1 'What went wrong' "$LOG" || tail -n 80 "$LOG"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/build.log

      - name: Sign the universal APK
        id: apk
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ls -l src/app/build/outputs/apk/release/
          APK=$(ls src/app/build/outputs/apk/release/*universal*.apk 2>/dev/null | head -n1)
          [ -n "$APK" ] || APK=$(ls src/app/build/outputs/apk/release/*.apk | head -n1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          echo "Using $APK"
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${ANDROID_KEY_BASE64:-}" ]; then
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$KS"
            ALIAS="$ANDROID_KEY_ALIAS"; PASS="$ANDROID_KEY_PASSWORD"
          else
            ALIAS=vxp; PASS=vxpbuild123
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=VirtualApp, O=VXP, C=US"
          fi
          # Drop the APK's existing (ephemeral debug) signature before re-signing.
          cp "$APK" "$RUNNER_TEMP/unsigned.apk"
          zip -q -d "$RUNNER_TEMP/unsigned.apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -n1)
          mkdir -p dist
          OUT="dist/VirtualApp-Android8-16-build${{ github.run_number }}.apk"
          "$BT/zipalign" -p -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | head -n 5
          unzip -l "$OUT" | grep -E 'lib/|LoadingActivity' || true
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp-release
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('vapp-{0}', github.run_number) }}
          name: VirtualApp (Android 8-16, build ${{ github.run_number }})
          body: |
            Virtual-app engine: BlackBox Reborn (maintained fork with Android 14/15/16 fixes).

            Install on the phone, then add apps with the + button.
            Built from commit ${{ github.sha }}.
          files: dist/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
