name: Build & Release VXPosed (Android 13-16)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Maintained VirtualApp engine (what VirtualXposed is built on) plus our
      # own fixes for the endless "Opening ..." screen.
      - name: Fetch engine source and apply fixes
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ISEKHON/VirtualApp.git src
          echo "engine HEAD: $(git -C src rev-parse HEAD)"
          python3 .ci/vxp/patch_engine.py src
          grep -n 'versionCode\|versionName' src/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform, build-tools and NDK
        shell: bash
        run: |
          set +o pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          install() { yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --install "$@"; }
          install "platform-tools" "platforms;android-34" "build-tools;30.0.0" "build-tools;34.0.0" "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: src
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show the real Gradle error
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          test -f "$LOG" || exit 0
          {
            echo '## Gradle error'
            echo '```'
            grep -n -A30 -m1 'What went wrong' "$LOG" || tail -n 80 "$LOG"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/build.log

      # The APK must always be signed with the same key, otherwise Android
      # refuses to install a newer build over the one that is already there.
      - name: Sign the universal APK
        id: apk
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ls -l src/app/build/outputs/apk/release/ || true
          APK=$(ls src/app/build/outputs/apk/release/*universal*.apk 2>/dev/null | head -n1 || true)
          [ -n "$APK" ] || APK=$(ls src/app/build/outputs/apk/release/*.apk | grep -v -- '-arm64-\|-armeabi-\|-x86' | head -n1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          if [ -n "${ANDROID_KEY_BASE64:-}" ]; then
            KS="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$KS"
            ALIAS="$ANDROID_KEY_ALIAS"; PASS="$ANDROID_KEY_PASSWORD"; KSTYPE=JKS
          elif [ -f .ci/vxp/signing.p12.b64 ]; then
            KS="$RUNNER_TEMP/release.p12"
            base64 -d .ci/vxp/signing.p12.b64 > "$KS"
            ALIAS=vxp; PASS=vxpbuild123; KSTYPE=PKCS12
          else
            KS="$RUNNER_TEMP/release.jks"
            ALIAS=vxp; PASS=vxpbuild123; KSTYPE=JKS
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=VirtualApp, O=VXP, C=US"
          fi
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          VER=$(grep -oP 'versionName\s+"\K[^"]+' src/app/build.gradle | head -n1)
          mkdir -p dist
          OUT="dist/VirtualApp-${VER}-build${{ github.run_number }}.apk"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-type "$KSTYPE" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | head -n 5
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp-release
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('vapp-{0}', github.run_number) }}
          name: VXPosed ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            VirtualApp/VirtualXposed engine, build ${{ github.run_number }}.

            * the engine call that starts a cloned app no longer runs on the
              UI thread, so a slow or hung start cannot freeze the
              "Opening ..." screen any more,
            * the loader hands over on the UI thread and watches the cloned
              process itself,
            * a failed start shows a real error with copyable details,
            * the APK is signed with one fixed key from now on, so new builds
              install over the previous one.

            Uninstall the older VXP app once, install this build, then check
            that Settings -> Apps -> VXP shows version 1.3.0.
          files: dist/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
