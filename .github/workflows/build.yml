name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Finds the Gradle project automatically:
      #  1. repo root, 2. any subfolder (up to 4 levels deep),
      #  3. inside a .zip committed to the repo (auto-extracted).
      - name: Locate (and auto-extract) project
        id: locate
        run: |
          find_project() {
            find "$1" -maxdepth 4 -name settings.gradle -not -path '*/.git/*' -not -path '*/node_modules/*' 2>/dev/null | head -n 1
          }

          SETTINGS=$(find_project .)

          if [ -z "$SETTINGS" ]; then
            echo "No Gradle project found in repo files, looking for zip archives..."
            while IFS= read -r ZIP; do
              echo "Trying $ZIP"
              rm -rf "$RUNNER_TEMP/extracted" && mkdir -p "$RUNNER_TEMP/extracted"
              unzip -q -o "$ZIP" -d "$RUNNER_TEMP/extracted" || continue
              SETTINGS=$(find_project "$RUNNER_TEMP/extracted")
              if [ -n "$SETTINGS" ]; then
                echo "Extracted project from $ZIP"
                break
              fi
            done < <(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*')
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::Could not find settings.gradle in the repo or in any .zip inside it."
            exit 1
          fi

          PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew

      - name: Build APKs and AARs
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug assembleRelease :Bcore:assembleDebug :Bcore:assembleRelease --stacktrace

      - name: Collect artifacts
        id: collect
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"
          cp ./app/build/outputs/apk/debug/*.apk "$DIST/" 2>/dev/null || true
          cp ./app/build/outputs/apk/release/*.apk "$DIST/" 2>/dev/null || true
          for AAR in $(find ./Bcore/build/outputs/aar -name "*.aar" 2>/dev/null); do
            cp "$AAR" "$DIST/BlackBox-Bcore-$(basename "$AAR")"
          done
          echo "Collected files:"
          ls -la "$DIST"
          if ! ls "$DIST"/*.apk >/dev/null 2>&1; then
            echo "::error::No APKs were produced"
            exit 1
          fi

          VERSION_NAME=$(grep -E 'versionName\s*=' build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE=false
          else
            TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
            PRERELEASE=true
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlackBox-${{ steps.collect.outputs.version }}-build-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: BlackBox ${{ steps.collect.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.collect.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Automated build from https://github.com/aryankumar1234

            **Install:** download the universal `*.apk` below (debug or release) and install it on your device.
            The `BlackBox-Bcore-*.aar` files are the core library builds.
            
